[package]
name = "attentracker-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
build = "build.rs"

# Separate Tauri's Cargo workspace from the core workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dependencies]
tauri = { version = "2", features = [] }
attent-core = { path = "../../../crates/attent-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Only optimize the hot CV crates in dev mode. Avoid recompiling the
# entire Tauri/GTK dependency graph with extra optimization on weak laptops.
[profile.dev.package.attent-camera]
opt-level = 2

[profile.dev.package.attent-model]
opt-level = 2

[profile.dev.package.attent-core]
opt-level = 2

[profile.dev.package.tract-core]
opt-level = 2

[profile.dev.package.tract-data]
opt-level = 2

[profile.dev.package.tract-linalg]
opt-level = 2

[profile.dev.package.tract-hir]
opt-level = 2

[profile.dev.package.tract-onnx]
opt-level = 2
